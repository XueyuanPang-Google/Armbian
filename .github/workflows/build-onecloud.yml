name: Build Onecloud Burn Image

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release'
        default: 'trixie'
        required: true
      minimal:
        description: 'Minimal (yes/no)'
        default: 'yes'
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Build
        env:
          CI: "true"
        run: |
          sudo -E ./compile.sh \
            BOARD=onecloud \
            BRANCH=current \
            RELEASE=${{ inputs.release }} \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=${{ inputs.minimal }} \
            KERNEL_CONFIGURE=no

      - name: List artifacts
        if: always()
        run: ls -lhR output/images/ 2>/dev/null || echo "(no output/images)"

      - name: Upload burn image
        uses: actions/upload-artifact@v4
        with:
          name: onecloud-${{ inputs.release }}-burn
          path: output/images/*.burn.img
          retention-days: 30
          if-no-files-found: error
